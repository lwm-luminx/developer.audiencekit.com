  """
  Its connection to the provider that runs its rooms, e.g. its Discord server.
  Null on AudienceKit, and for anyone but its admins.
  """
  account: ChatAccount @requires(permissions: ["chat:write:*"])

  """
  A locale's chat transcript, newest first. Admins only; talent who can post
  there (Person.chat.rooms) read its last 24 hours.
  """
  localeMessages(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Also return removed messages, each with its removal. Ignored for talent.
    """
    includeRemoved: Boolean = false

    """
    Returns the last _n_ elements from the list.
    """
    last: Int

    """
    The ID of the locale.
    """
    localeId: ID!
  ): LocaleMessageConnection! @requires(permissions: ["chat:read:mine"])

  """
  The instance's IAudienceChatModeration mixin. Left out of the schema where its module isn't installed.
  """
  moderation: IAudienceChatModeration! @endpoint(in: [AUDIENCE, STAFF])

  """
  The chat moderators audiences can use, and what each reads and can do.
  """
  moderationProviders(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): IModerationProviderConnection!

  """
  Who runs its rooms: AudienceKit unless it connected another provider. Apps
  check inApp before opening a room, and otherwise send people to the room's url.
  """
  provider: ChatProvider!

  """
  The chat providers an audience can use, and what each supports.
  """
  providers(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): ChatProviderConnection!

  """
  Who a room's admins can post as besides themselves and the venue
  (sendChatMessage asPersonId): the people on its events and lineup tonight,
  those on now first, then a venue's regulars. Empty for anyone but the room's admins.
  """
  roomHosts(
    """
    The locale whose room it is (or venueId).
    """
    localeId: ID

    """
    The venue whose room it is (or localeId).
    """
    venueId: ID
  ): [ChatHostChoice!]! @requires(permissions: ["chat:read:mine"])

  """
  The audience's chat rooms, the most recently active first. Admins see every
  venue and locale; venue listing managers their own venues.
  """
  rooms(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): ChatRoomConnection! @requires(permissions: ["chat:read:mine"])

  """
  Venues with a chat community of their own (e.g. a venue's own Discord server),
  whose rooms go there instead of the audience's. Admins only.
  """
  venueAccounts: [ChatAccount!]! @requires(permissions: ["chat:write:*"])

  """
  People banned from a venue (its chat and seeing it), newest first. Admins, and the managers of that venue's listing, only.
  """
  venueBans(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int

    """
    The venue UUID.
    """
    venueId: ID!
  ): VenueChatBanConnection! @requires(permissions: ["chat:moderate:mine", "chat:moderate:venue"])

  """
  A venue's chat transcript, newest first. Admins, and the managers of that
  venue's listing, only; talent who can post there (Person.chat.rooms) read its last 24 hours.
  """
  venueMessages(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Also return removed messages, each with its removal, so messages taken down
    for breaking the terms stay on record. Ignored for talent.
    """
    includeRemoved: Boolean = false

    """
    Returns the last _n_ elements from the list.
    """
    last: Int

    """
    The ID of the venue.
    """
    venueId: ID!
  ): VenueMessageConnection! @requires(permissions: ["chat:read:mine", "chat:read:venue"])
}

"""
