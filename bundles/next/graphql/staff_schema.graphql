  """
  shadow, not_run, awaiting, done, partial, failed or dismissed.
  """
  executionState: String

  """
  Whether a guard or rule check flagged the message.
  """
  flagged: Boolean!

  """
  Its ID.
  """
  id: ID!

  """
  The moderation provider that sent it.
  """
  providerKey: String!

  """
  The room: a venue or locale ID.
  """
  roomId: String

  """
  venue or locale.
  """
  roomKind: String

  """
  The room's name.
  """
  roomName: String

  """
  live (the feed), replay or try (a made-up conversation).
  """
  source: String!

  """
  What it chose to do, e.g. no_action, room_message, pin_message.
  """
  tool: String

  """
