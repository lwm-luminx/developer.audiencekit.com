  """
  chatModeration(
    """
    The cursor of the last event handled; without it, every kept event is sent.
    """
    after: ID
  ): ChatModerationEvent! @requires(permissions: ["chat:moderate:*"])

  """
  Follows the audience's chat rooms, as `chat { rooms }` lists them: a room,
  fresh, whenever someone joins or leaves it or its messages change (posted,
  edited, removed, cleared). Admins hear every room; venue listing managers
  their own venues. Nothing arrives on subscribing.
  """
  chatRooms: ChatRoom! @requires(permissions: ["chat:read:mine"])

  """
  The decision queue as it changes: a decision added for a person, decided, or
  set aside to wait on someone else. Nothing arrives on subscribing; read
  `decisions` first.
  """
  decisionQueue: DecisionQueueChange! @requires(permissions: ["audience:moderate:*"]) @endpoint(in: [STAFF])

  """
  Follows a venue's door for tonight: DoorOpened, then every cover that's paid,
  scanned in or refunded, with fresh totals. For whoever may work the door: its
  admins, its listing managers, and a venue device with `door`.
  """
  door(
    """
    The venue.
    """
    venueId: ID!
  ): DoorEvent! @requires(permissions: ["cover:write:door", "cover:write:venue"])

  """
  Follows a record's lists (a venue's events, an event's appearances): an event
  whenever a member joins, leaves or changes, carrying the member as you may
  read it. Name an `edge` to hear about one list only.
  """
  edgeChanged(
    """
    Only this list, by its association's name (`events`); every list without it.
    """
    edge: String

    """
    The record's ID, as node(id:) takes it.
    """
    id: ID!
  ): EdgeChanged! @requires(permissions: ["audience:read:self", "venues:read:venue"])

  """
  Tells a worker device that work of the types it follows is waiting on the
  evaluation queue: once on subscribing when any is, then as work is queued, and
  each minute while it waits.
  """
  evaluationQueue(
    """
    Only these types, of those the token holds; every one by default.
    """
    evaluationTypes: [String!]
  ): EvaluationsAvailable! @requires(permissions: ["evaluations:write:*"]) @endpoint(in: [STAFF])

  """
  Follows a locale's chat room, for people out in the locale and not at a venue:
  ChatJoined, then everything the room says and who comes and goes, until
  ChatLeft. The room's admins join from anywhere.
  """
  localeChat(
    """
    The locale.
    """
    localeId: ID!

    """
    Follows the room without being in it: no presence, so nobody sees the
    subscriber as in chat. For a glimpse of the room, like ChatPeek.
    """
    watch: Boolean = false
  ): ChatRoomEvent! @requires(permissions: ["chat:read:self"])

  """
  Your notifications while the app is open, in concert with your devices' push
  service: each push sent to you (a friend's ping, a reply) arrives here too,
  with the `notificationId` the device copy carries, so the app shows it itself
  and skips the system banner. Nothing arrives on subscribing.
  """
  myNotifications: PushNotification! @requires(permissions: ["users:read:self"])

  """
  Follows a record by its ID: an event whenever it changes or is deleted,
  carrying the record as you may read it then, so you select what you show and
  need no refetch. Any Node you can see; nothing arrives until it changes.
  """
  nodeChanged(
    """
