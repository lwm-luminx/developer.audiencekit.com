    """
    id: ID!
  ): NodeChanged! @requires(permissions: ["audience:read:self", "venues:read:venue"])

  """
  Follows a room you're in: an event whenever something said or posted there is
  added, changed (edited, pinned, a reply or file added) or removed, while
  you're still in it. Nothing arrives on subscribing.
  """
  room(
    """
    The room's UUID.
    """
    id: ID!
  ): RoomEvent! @requires(permissions: ["rooms:read:member"])

  """
  Follows a venue's chat room: ChatJoined, then everything the room says and who
  comes and goes, until ChatLeft. Open to people at the venue, and to the room's
  admins from anywhere.
  """
  venueChat(
    """
    The venue.
    """
    venueId: ID!

    """
