"""
A record you can fetch again with `node(id:)`. Its `id` is the record's UUID.
"""
interface Node {
  """
  ID of the object.
  """
  id: ID!
}

"""
What happened to a record.
"""
enum NodeChange {
  """
  It's gone.
  """
  DELETED

  """
  It changed: `fields` says which of its own fields.
  """
  UPDATED
}

"""
A record you follow (Subscription.nodeChanged) changed.
"""
type NodeChanged {
  """
  What happened to it.
  """
  change: NodeChange!

  """
  The fields of its own that changed, as GraphQL names them; empty when it's deleted.
  """
  fields: [String!]!

  """
  Its ID.
  """
  id: ID!

  """
  The record as it is now, as you may read it; null when deleted.
  """
  node: Node
}

