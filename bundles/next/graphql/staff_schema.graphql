A Meta metro area (a Nielsen DMA, Meta's geo_market), as Facebook ad targeting names it.
"""
type MetaMetro {
  """
  Its country, e.g. US. Only on search results.
  """
  countryCode: String

  """
  Meta's key for it, e.g. DMA:819.
  """
  key: String!

  """
  Its name on Meta, e.g. Seattle-Tacoma (WA).
  """
  name: String
}

"""
The connection type for MetaMetro.
"""
type MetaMetroConnection {
  """
  A list of edges.
  """
  edges: [MetaMetroEdge]

  """
  A list of nodes.
  """
  nodes: [MetaMetro]

  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!
}

"""
An edge in a connection.
"""
type MetaMetroEdge {
  """
  A cursor for use in pagination.
  """
  cursor: String!

  """
  The item at the end of the edge.
  """
  node: MetaMetro
}

"""
A Meta metro area to link a locale to, from Query.facebook.metroSearch.
"""
input MetaMetroInput {
  """
  Meta's key for it, e.g. DMA:819.
  """
  key: String!

  """
  Its name on Meta, e.g. Seattle-Tacoma (WA).
  """
  name: String
}

"""
What kind of app it is.
"""
enum MobileAppKind {
  """
  The full app.
  """
  APP

  """
  An iOS App Clip: opens a link's page without installing the app.
  """
  APP_CLIP
}

"""
The platform an app runs on.
"""
enum MobilePlatform {
  """
  Android.
  """
  ANDROID

  """
  iPhone and iPad.
  """
  IOS
}

"""
Something a moderation provider did, as recorded for the audience's admins.
"""
type ModerationAction {
  """
  What it did.
  """
  action: ChatModerationProviderAction!

  """
  The policy category.
  """
  category: ChatModerationCategory

  """
  How sure it was, from 0 to 1.
  """
  confidence: Float

  """
  When.
  """
  createdAt: ISO8601DateTime!

  """
  The event in the feed it answered, if any.
  """
  cursor: ID

  """
  Its UUID.
  """
  id: ID!

  """
  Its reason, in a line.
  """
  reason: String

  """
  Who it was about: their handle in this provider's feed.
  """
  subject: String
}

"""
An amount of money: whole cents of a currency. $10.00 is { cents: 1000, currency: "usd" }.
"""
type Money {
  """
  The amount in the currency’s minor unit (cents for dollars).
  """
  cents: Int!

  """
  Its ISO 4217 code in lower case, e.g. usd.
  """
  currency: String!
}

"""
An amount of money: whole cents of a currency, as Money gives it.
"""
input MoneyInput {
  """
  The amount in the currency’s minor unit (cents for dollars).
  """
  cents: Int!

  """
  Its ISO 4217 code, e.g. usd. Case does not matter.
  """
  currency: String!
}

