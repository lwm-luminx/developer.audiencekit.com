  """
  Adds a photo taken with the app's camera at a venue (only while the app places
  you there): it's marked AMATEUR, credited to you, put on the event under way
  there, and tagged with whoever is on stage, so it shows on the venue's, the
  event's and their pages (IPosts.photos).
  """
