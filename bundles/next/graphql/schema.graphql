  provider. Asking again the same night returns the same pending or paid coat check pass.
  """
  buyCoatCheck(
    """
    Parameters for CoatCheckBuy
    """
    input: CoatCheckBuyInput!
  ): CoatCheckBuyPayload @requires(permissions: ["cover:write:self"])

  """
  Starts paying tonight's cover at a venue, through the venue's provider.
  Stripe: finish the payment with Stripe's payment sheet
  (paymentIntentClientSecret, on the venue's account stripeAccountId, with
  publishableKey), then call confirmCover. Square: make a payment token with
  Square's In-App Payments SDK (squareApplicationId, squareLocationId), then
  call payCover with it. Asking again the same night returns the same pass.
  """
  buyCover(
    """
    Parameters for CoverBuy
    """
    input: CoverBuyInput!
  ): CoverBuyPayload @requires(permissions: ["cover:write:self"]) @appClip(clips: ["HOT_MESS"])

  """
  Cancels a pairing at any point: neither of you sees the other from then on.
  Cancelling your pairing takes you out of Quickie for tonight (your partner
  looks for someone new); a bonus topic just ends.
