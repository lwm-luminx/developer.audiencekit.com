    Parameters for SafetyAlertCancel
    """
    input: SafetyAlertCancelInput!
  ): SafetyAlertCancelPayload @requires(permissions: ["users:write:self"])

  """
  Checks the hashed contacts from the viewer's phone (ContactMatching: SHA-256
