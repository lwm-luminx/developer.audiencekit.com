row naming its default zone (isDefault). Lineups with no zone are in the default
zone, called Stage unless named.
"""
type StageZone implements Node {
  """
  Its UUID.
  """
  id: ID!

  """
  Whether it names the venue's default zone.
  """
  isDefault: Boolean!

  """
  What staff call it, e.g. Patio.
  """
  name: String!

  """
  Its place among the venue's zones, from 0.
  """
  position: Int!

  """
  Its venue.
  """
  venue: Venue!
}

"""
A suggestion about the audience's listings: a missing venue or event, a
correction, a closure, a tag, local rules or a performer. Nothing it proposes is
live until a reviewer approves it.
"""
type Submission {
  """
  What the submitter wrote. Admins only, since it may say who they are.
  """
  body: String @requires(permissions: ["audience:moderate:*"])

  """
  For SOCIAL_LINK: the handles it found, the proposed one first. A reviewer
  approves another with EDIT_APPROVE and {provider, handle}.
  """
  choices: [String!]!

  """
  When it was filed.
  """
  createdAt: ISO8601DateTime!

  """
  The listing as it is now, for the fields it proposes.
  """
  current: JSON!

  """
  When it was decided.
  """
  decidedAt: ISO8601DateTime

  """
  Its decisions, oldest first.
  """
  decisions: [SubmissionDecision!]!

  """
  How many people say it is wrong, e.g. that a venue is still open.
  """
  disputeCount: Int! @requires(permissions: ["audience:moderate:*"])

  """
  The event it is about, or that approving it added.
  """
  event: Event

  """
  Links and photos: [{kind, url, photoId, photoUrl}]. Admins only, since they may show who filed it.
  """
  evidence: JSON! @requires(permissions: ["audience:moderate:*"])

  """
  Its ID.
  """
  id: ID!

  """
  What it proposes.
  """
  kind: SubmissionKind!

  """
  The city it was filed in.
  """
  locale: Locale

  """
  The person it is about (SOCIAL_LINK).
  """
  person: Person

  """
  Its place in the queue: higher first. Admins only.
  """
  priority: Float! @requires(permissions: ["audience:moderate:*"])

  """
  The fields it proposes.
  """
  proposed: JSON!

  """
  How many people filed it.
  """
  reporterCount: Int!

  """
  What researching it found, oldest first. Admins only.
  """
  research: [ResearchResult!]! @requires(permissions: ["audience:moderate:*"])

  """
  low, normal or high.
  """
  risk: String!

  """
  The recurring night it is about.
  """
  series: EventSeries

  """
  Where it is in review.
  """
  status: SubmissionStatus!

  """
  Who filed it. Admins only.
  """
  submitter: Profile @requires(permissions: ["audience:moderate:*"])

  """
  attendee, talent, venue_staff, admin or system, when filed. Admins only.
  """
  submitterRole: String! @requires(permissions: ["audience:moderate:*"])

  """
  The submitter's trust when filed, 0 to 1. Admins only.
  """
  submitterTrust: Float @requires(permissions: ["audience:moderate:*"])

  """
  The venue it is about (or its event is at), or that approving it added.
  """
  venue: Venue
}

"""
A decision on a suggestion.
"""
type SubmissionDecision {
  """
  What was decided.
  """
  action: SubmissionDecisionAction!

  """
  Whether it was rejected as bad faith.
  """
  badFaith: Boolean!

  """
  When.
  """
  createdAt: ISO8601DateTime!

  """
  What was applied.
  """
  finalDiff: JSON!

  """
  Its ID.
  """
  id: ID!

  """
  The reviewer's reason.
  """
  reason: String

  """
  Who decided. Admins only.
  """
  reviewer: Profile @requires(permissions: ["audience:moderate:*"])
}

"""
What a reviewer decides about a suggestion (Mutation.decideSubmission).
"""
enum SubmissionDecisionAction {
  """
  Apply it as proposed.
  """
  APPROVE

  """
  Applied without a person (off; never sent by clients).
  """
  AUTO_APPLY

  """
  Apply the reviewer’s edited version (proposed).
  """
  EDIT_APPROVE

  """
  Ask the venue's staff to confirm it first.
  """
  NEEDS_VENUE

  """
  Don’t apply it; a reason is required.
  """
  REJECT
}

"""
A link or photo that shows a suggestion is right.
"""
input SubmissionEvidenceInput {
  """
  link or photo.
  """
  kind: String!

  """
  An uploaded photo, for a photo.
  """
  photoId: ID

  """
  A web address, for a link.
  """
  url: String
}

"""
What a suggestion proposes (Mutation.submitContribution).
"""
enum SubmissionKind {
  """
  A venue that has closed for good.
  """
  CLOSED

  """
  A fix to a venue's or event's details.
  """
  CORRECTION

  """
  A fix to a venue's local rules, by its verified staff only (Mutation.submitLocalRulesCorrection).
  """
  LOCAL_RULES_CORRECTION

  """
  An event that is not listed yet.
  """
  MISSING_EVENT

  """
  A venue that is not listed yet.
  """
  MISSING_VENUE

  """
  A social profile for a person or venue that research wasn't sure of (an import
  files these; members cannot). Its choices are the profiles it found; approving
  one makes it the profile on that network.
  """
  SOCIAL_LINK

  """
  A tag for an event or a recurring night; never for a venue.
  """
  TAG_SUGGESTION

  """
  A performer who is on at an event.
  """
  TALENT_LINK

  """
  A tribe for the audience's curated list (the picker's "Suggest a tribe").
  About nothing listed; approving it adds the tribe.
  """
  TRIBE_SUGGESTION
}

"""
Where a suggestion is in review.
"""
enum SubmissionStatus {
  """
  Approved and applied.
  """
  APPROVED

  """
  Waiting for a person to decide.
  """
  IN_REVIEW

  """
  The same as another suggestion, decided with it.
  """
  MERGED

  """
  Waiting for the venue's staff to confirm it.
  """
  NEEDS_VENUE

  """
  Not applied.
  """
  REJECTED

  """
  Being checked by the researcher.
  """
  RESEARCHING

  """
  Filed, not yet queued.
  """
  SUBMITTED
}

"""
The subscription root of this schema
"""
type Subscription {
  """
  Follows a record's lists (a venue's events, an event's appearances): an event
  whenever a member joins, leaves or changes, carrying the member as you may
  read it. Name an `edge` to hear about one list only.
  """
  edgeChanged(
    """
    Only this list, by its association's name (`events`); every list without it.
    """
    edge: String

    """
    The record's ID, as node(id:) takes it.
    """
    id: ID!
  ): EdgeChanged! @requires(permissions: ["audience:read:self", "venues:read:venue"])

  """
  Follows a locale's chat room, for people out in the locale and not at a venue:
  ChatJoined, then everything the room says and who comes and goes, until
  ChatLeft. The room's admins join from anywhere.
  """
  localeChat(
    """
    The locale.
    """
    localeId: ID!

    """
    Follows the room without being in it: no presence, so nobody sees the
    subscriber as in chat. For a glimpse of the room, like ChatPeek.
    """
    watch: Boolean = false
  ): ChatRoomEvent! @requires(permissions: ["chat:read:self"])

  """
  Your notifications while the app is open, in concert with your devices' push
  service: each push sent to you (a friend's ping, a reply) arrives here too,
  with the `notificationId` the device copy carries, so the app shows it itself
  and skips the system banner. Nothing arrives on subscribing.
  """
  myNotifications: PushNotification! @requires(permissions: ["users:read:self"])

  """
  Follows a record by its ID: an event whenever it changes or is deleted,
  carrying the record as you may read it then, so you select what you show and
  need no refetch. Any Node you can see; nothing arrives until it changes.
  """
  nodeChanged(
    """
    The record's ID, as node(id:) takes it.
    """
    id: ID!
  ): NodeChanged! @requires(permissions: ["audience:read:self", "venues:read:venue"])

  """
  Follows a venue's chat room: ChatJoined, then everything the room says and who
  comes and goes, until ChatLeft. Open to people at the venue, and to the room's
  admins from anywhere.
  """
  venueChat(
    """
    The venue.
    """
    venueId: ID!

    """
    Follows the room without being in it: no presence, so nobody sees the
    subscriber as in chat. For a glimpse of the room, like ChatPeek.
    """
    watch: Boolean = false
  ): ChatRoomEvent! @requires(permissions: ["chat:read:self", "chat:read:venue"])
}

