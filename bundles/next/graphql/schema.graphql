"""
The local People implementation of who is on at a venue.
"""
type VenuePeopleView implements IVenuePeople {
  """
  The next curtain call's readiness as counts, for anyone (guests too). Null unless the act up next has a curtain call.
  """
  curtainReadiness: CurtainReadiness

  """
  The go/no-go of the act up next in tonight's running order, when it has a
  curtain call. Null otherwise, and for anyone not working the show.
  """
  goNoGo: GoNoGo

  """
  People added here without a People page, like a one-off host, by name: to put
  on its lineups again (createGuestPerson). Empty for anyone not working its shows.
  """
  guests: [Person!]!

  """
  The acts on a night that have a time (or have gone on), in running order.
  """
  lineup(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int

    """
    Another night than tonight.
    """
    night: ISO8601Date
  ): AppearanceConnection!

  """
  A lineup as an audiencekit.lineup file (doc/IMPORT_EXPORT.md), for
  importLineup: the venue night's own, or an event's. Null for anyone not
  working the show.
  """
  lineupFile(
    """
    An event's lineup at the venue instead.
    """
    eventId: ID

    """
    Another night than tonight.
    """
    night: ISO8601Date
  ): JSON

  """
  A night's zone lineups (doc/LINEUP_MODEL.md): the default zone's (Stage), then
  each named zone's. Each holds its events as steps, and their lineups as children.
  """
  lineups(
    """
    Another night than tonight.
    """
    night: ISO8601Date
  ): [Lineup!]!

  """
  The acts on there right now.
  """
  onNow(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): AppearanceConnection!

  """
  What tonight's lineup is on now, an act or an intermission: what advancing
  takes off. Null before the show starts and after it ends. The lineup is the
  one with something on stage, else the started event's, else the venue's own.
  """
  onStage: Appearance

  """
  Everything on a night's lineups in order: the venue's own, then its events' as
  they start; intermissions and entries with no set time too.
  """
  runningOrder(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int

    """
    Another night than tonight.
    """
    night: ISO8601Date
  ): AppearanceConnection!

  """
  Tonight's show, the lineup advancing moves (see onStage): who covers the
  stage, whether it can be ended, when it ends on its own.
  """
  show: ShowStatus!

  """
  A night's shows: the venue's own lineup, then its events' as they start.
  """
  shows(
    """
    Another night than tonight.
    """
    night: ISO8601Date
  ): [ShowStatus!]!

  """
  The show on now in a zone (the default zone without zoneId): an event's lineup
  from its preshow to its end, else the zone's night. What cueLineup on the
  zone's night moves.
  """
  stage(
    """
    A named zone.
    """
    zoneId: ID
  ): Lineup!

  """
  Its zones, in order. The default zone (Stage) is listed only when the venue has named it.
  """
  stageZones: [StageZone!]!

  """
  A night's support staff on the venue's own show, then its events'. Empty for anyone not working the show.
  """
  supportStaff(
    """
    Another night than tonight.
    """
    night: ISO8601Date
  ): [StaffAssignment!]!

  """
  What advancing tonight's running order puts on next.
  """
  upNext: Appearance
}

"""
One of a venue’s regular nights: a tag its events or series carried in enough of
the last 13 weeks. Worked out daily; staff can hide one but not edit it.
"""
type VenueRegularNight {
  """
  When it drops off the venue if it doesn’t run again.
  """
  fadesOn: ISO8601Date!

  """
  Whether its staff hid it. Only managers ever see hidden ones.
  """
  hidden: Boolean!

  """
  When it last ran there.
  """
  lastRunOn: ISO8601Date!

  """
  The series most of its nights came from, if any.
  """
  series: EventSeries

  """
  How it is going.
  """
  status: VenueRegularNightStatus!

  """
  The tag.
  """
  tag: Tag!

  """
  Whether it ran in each of the last 13 weeks, oldest first; the last is the week ending today.
  """
  weeks: [Boolean!]!

  """
  In how many of the last 13 weeks it ran.
  """
  weeksRun: Int!
}

"""
How a regular night is going, from the last 13 weeks of the venue’s events.
"""
enum VenueRegularNightStatus {
  """
  Hasn’t run for 6 weeks; it drops off at fadesOn.
  """
  FADING

  """
  Runs about once a month, or from a monthly series.
  """
  MONTHLY

  """
  Runs now and then.
  """
  OCCASIONAL

  """
  Ran in at least 8 of the last 13 weeks.
  """
  STEADY
}

