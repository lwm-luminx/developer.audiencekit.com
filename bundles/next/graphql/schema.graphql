schema {
  query: Audience
  mutation: Mutation
  subscription: Subscription
}

"""
App Clips call this field (HOT_MESS, VELVET, BACKSTAGE), so their small clients
(doc/APP_CLIP_API.md) depend on it. Keep it working for clips people already
have: add a replacement and deprecate rather than change it. It is a marking,
not security: @requires is enforced as on any other field.
"""
directive @appClip(
  """
  The clips that call it.
  """
  clips: [String!]!
) on FIELD_DEFINITION

"""
The endpoints this field is on: AUDIENCE (an audience's graph), STAFF (the same
graph with the staff edges) and TENANTS (platform administration). Without it a
field is on every endpoint where its type is reachable. It is visibility, not
security: @requires is enforced on every endpoint.
"""
directive @endpoint(
  """
  The endpoints it is on.
  """
  in: [Endpoint!]!
) on FIELD_DEFINITION | INTERFACE

"""
Connects a module capability to the audience tag populated by that capability.
"""
directive @facet(
  """
  The connected tag key, e.g. karaoke, music or tickets.
  """
  tag: String!
) on INTERFACE | OBJECT

"""
Declares a module-owned interface available as an edge on eligible object types.
"""
directive @mixin(
  """
  The module that owns this contract.
  """
  extensionKey: String!

  """
  The generated edge name.
  """
  field: String!

  """
  False when the edge is never null where its module is installed; where it is not, the edge is left out of the schema.
  """
  null: Boolean = true

  """
  Eligible GraphQL object type names.
  """
  on: [String!]!

  """
  Makes it a facet: the key of the tag (Tag.facet) a record carries for the edge
  to resolve on it. Null on records without it; they list it in their facets
  when they have it.
  """
  tag: String
) on INTERFACE

"""
The permissions that let a caller use this field, any one of them: each
`namespace:action:scope`, where namespace is the owning module (or a core area),
action is read, write, moderate or admin, and scope is * (anything in the
audience), mine (what the caller manages), my_troupes (troupes they act for),
venue (a venue device's venue), self (their own records) or door (venues whose
door they work). Without it a field is public.
"""
directive @requires(
  """
  Any one of these permits the field.
  """
  permissions: [String!]!
) on FIELD_DEFINITION | INTERFACE

"""
Autogenerated input type of AccountDelete
"""
input AccountDeleteInput {
  """
  A unique identifier for the client performing the mutation.
  """
  clientMutationId: String

  """
  Must be true.
  """
  confirm: Boolean!
}

"""
Autogenerated return type of AccountDelete.
"""
type AccountDeletePayload {
  """
  A unique identifier for the client performing the mutation.
  """
  clientMutationId: String

  """
  Whether the account is gone.
  """
  deleted: Boolean!
}

"""
Someone's cover for one night at a venue, and their pass. See CoverPass for the QR code.
"""
type Admission implements ICharge & Node {
  """
  The cover.
  """
  amount: Money!

  """
  When the door first scanned it.
  """
  checkedInAt: ISO8601DateTime

  """
  Coat check hanger or claim number.
  """
  claimCheckNumber: String

  """
  When the record was created.
  """
  createdAt: ISO8601DateTime!

  """
  The event that night, if it set the cover.
  """
  event: Event

  """
  The Hot Mess fee.
  """
  fee: Money!

  """
  Unique identifier.
  """
  id: ID!

  """
  Whether the buyer can refund it themselves: paid, not scanned in, and the night isn't over.
  """
  isRefundable: Boolean!

  """
  The kind of pass (cover or coat_check).
  """
  kind: AdmissionKindEnum!

  """
  The local date of the cover night.
  """
  night: ISO8601Date!

  """
  The pass QR code right now, for clients that don't make their own. Changes every 30 seconds. The buyer only.
  """
  passCode: String

  """
  The Base64 key the app makes the pass QR code with. The buyer only; null for everyone else.
  """
  passSecret: String

  """
  The buyer: their name for the door and the console, their picture so the door can match faces.
  """
  profile: Profile!

  """
  Number of covers in this admission.
  """
  quantity: Int!

  """
  How many times the door has scanned it.
  """
  scanCount: Int!

  """
  Current payment status.
  """
  status: AdmissionStatus!

  """
  The cover tier, e.g. general, vip.
  """
  tier: String

  """
  What the buyer paid.
  """
  total: Money!

  """
  The venue associated with this record.
  """
  venue: Venue!
}

"""
The connection type for Admission.
"""
type AdmissionConnection {
  """
  A list of edges.
  """
  edges: [AdmissionEdge]

  """
  A list of nodes.
  """
  nodes: [Admission]

  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!

  """
  How many there are in all, whatever page this is.
  """
  totalCount: Int!
}

"""
An edge in a connection.
"""
type AdmissionEdge {
  """
  A cursor for use in pagination.
  """
  cursor: String!

  """
  The item at the end of the edge.
  """
  node: Admission
}

"""
The kind of admission or service pass.
"""
enum AdmissionKindEnum {
  """
  A coat check claim ticket pass.
  """
  COAT_CHECK

  """
  A cover pass to enter the venue.
  """
  COVER
}

"""
Autogenerated input type of AdmissionRefund
"""
input AdmissionRefundInput {
  """
  The cover admission identifier.
  """
  admissionId: ID!

  """
  A unique identifier for the client performing the mutation.
  """
  clientMutationId: String
}

"""
Autogenerated return type of AdmissionRefund.
"""
type AdmissionRefundPayload {
  """
  The cover admission affected by this operation.
  """
  admission: Admission!

  """
  A unique identifier for the client performing the mutation.
  """
  clientMutationId: String
}

"""
Where a cover payment stands.
"""
enum AdmissionStatus {
  """
  The payment was abandoned.
  """
  CANCELED

  """
  The buyer disputed the charge with their bank.
  """
  DISPUTED

  """
  The payment was declined.
  """
  FAILED

  """
  Paid: the pass works.
  """
  PAID

  """
  Paying in the app has started but not finished.
  """
  PENDING

  """
  The money went back; the pass no longer works.
  """
  REFUNDED
}

"""
What an iOS app's update prompts tell installs from one StoreKit 2 environment
(TestFlight or the App Store): the build to offer and the oldest one that still
works. Null fields mean no opinion.
"""
type AppReleaseChannel {
  """
  When latestBuild starts being offered (CI waits for TestFlight to process it).
  """
  availableAt: ISO8601DateTime

  """
  The newest build (CFBundleVersion).
  """
  latestBuild: Int

  """
  Its version, e.g. 2.1.
  """
  latestVersion: String

  """
  Builds below this must update before they can be used.
  """
  minimumBuild: Int

  """
  What's new, one line each.
  """
  notes: [String!]!

  """
  When it last changed.
  """
  updatedAt: ISO8601DateTime

  """
  Who changed it last: the CI token, or "admin".
  """
  updatedBy: String
}

"""
A code App Review signs in with and the test account it signs in as: the demo
venue's code (the main reviewer, in Hot Mess and the staff apps) or an
AppReviewCode linked to its own account.
"""
type AppReviewCode {
  """
  The code; null for one set before codes were kept.
  """
  code: String

  """
  When the code stops working.
  """
  expiresAt: ISO8601DateTime

  """
  Its UUID.
  """
  id: ID!

  """
  What the code is for.
  """
  label: String!

  """
  Whether removeAppReviewCode can remove it: not the demo venue's main code,
  which createAppReviewCode or resetAppReview replaces.
  """
  removable: Boolean!

  """
  The email address of the test account it signs in as.
  """
  userEmail: String

  """
  The name of the test account it signs in as.
  """
  userName: String
}

"""
An entry in a lineup: someone (or several people) on, or an intermission. A
lineup is a venue night's own, built as the night goes, or an event's, built
ahead. Each runs in `position` order and can be advanced like a slide deck
(advanceLineup).
"""
type Appearance implements Node {
  """
  A segment or intermission: what runs in the venue's chat while it's on; null for nothing.
  """
  activity: AppearanceActivity

  """
  A break inside an act: the scene it follows.
  """
  afterScene: Scene

  """
  When advancing (or finishing it) took it off.
  """
  cameOffAt: ISO8601DateTime

  """
  An act the curtain rises on: places is called this many minutes before it (or
  once it is up next), and it goes on only on a go (goNoGo). Null: no curtain call.
  """
  curtainCallMinutes: Int

  """
  endTiming DURATION: how long it runs once on.
  """
  durationMinutes: Int

  """
  How it ends.
  """
  endTiming: AppearanceEndTiming!

  """
  Its set end time; null until close or advanced.
  """
  endsAt: ISO8601DateTime

  """
  What ending it goes to, as set: an act's scenes unless they say, or a break.
  """
  endsTo: ShowEndsTo

  """
  What it is: an act, an intermission or a segment.
  """
  entryKind: AppearanceKind!

  """
  How long it is expected to run: its set length, else an act's scenes or tracks plus other time; null when nothing says.
  """
  estimatedMinutes: Int

  """
  The event whose lineup it's on, built ahead; null for one on the venue night's own lineup.
  """
  event: Event

  """
  An act: time beyond its scenes or tracks, as set; null for the default (10 minutes).
  """
  extraMinutes: Int

  """
  Whether it stretches or shrinks to bring the show back on time.
  """
  flexible: Boolean!

  """
  An act's curtain call go/no-go: who is ready. Null without a curtain call, and for anyone not working the show.
  """
  goNoGo: GoNoGo

  """
  Its UUID.
  """
  id: ID!

  """
  An act or an intermission. Segments read as INTERMISSION here, for apps built
  before them (they fail on values they do not know); entryKind has the full kind.
  """
  kind: AppearanceKind!

  """
  How many minutes after its set time it starts, as projected (negative: early); null without a set time.
  """
  lateMinutes: Int

  """
  The lineup it's on (doc/LINEUP_MODEL.md): a zone's night or an event's in a zone.
  """
  lineup: Lineup

  """
  The longest it runs when it flexes, as set.
  """
  maxMinutes: Int

  """
  The shortest it runs when it flexes, as set.
  """
  minMinutes: Int

  """
  How many of an act's scenes have no length or track (each counted as 4 minutes in the estimate).
  """
  missingTracks: Int!

  """
  The venue night it is on.
  """
  night: ISO8601Date!

  """
  Notes for the crew, in Markdown.
  """
  notes: String

  """
  Who's on it, in billing order: two for a duet.
  """
  people(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): PersonConnection!

  """
  Who, or the first of them; null for an intermission.
  """
  person: Person

  """
  Its place in its lineup's running order, from 0.
  """
  position: Int!

  """
  An act: its own preshow before it, from doors to the host, in minutes.
  """
  preshowMinutes: Int

  """
  When it is expected off: when it came off, its hard end, else its projected start plus its estimate.
  """
  projectedEndsAt: ISO8601DateTime

  """
  When it is expected on: when it went on, its hard time, else moved out behind what runs late.
  """
  projectedStartsAt: ISO8601DateTime

  """
  What they are doing; null for an intermission.
  """
  role: AppearanceRole

  """
  An act's numbers, in order.
  """
  scenes: [Scene!]!

  """
  A singer's karaoke signup: the song, artist and who is singing it; null for everything else.
  """
  songRequest: SongRequest

  """
  How it starts.
  """
  startTiming: AppearanceStartTiming!

  """
  Its set (hard or soft) time, or when an entry with no set time went on; null until then.
  """
  startsAt: ISO8601DateTime

  """
  Upcoming, on now or done.
  """
  state: AppearanceState!

  """
  What has to happen for it: its venue's, event series', event's and talent's
  task templates, then its own. Null for anyone not working the show.
  """
  tasks(
    """
    List the tasks taken off it too (removed true).
    """
    includeRemoved: Boolean = false
  ): [LineupTask!]

  """
  An act's billing (a duet's name) or an intermission's label, if it has one.
  """
  title: String

  """
  Who moves its trivia along; null unless it runs trivia.
  """
  triviaDriver: TriviaDriver

  """
  When its trivia answers show; null unless it runs trivia.
  """
  triviaReveal: TriviaReveal

  """
  The trivia set it runs: its own, else the best match for its event or venue tags. Null unless it runs trivia.
  """
  triviaSet: TriviaSet

  """
  Where.
  """
  venue: Venue!

  """
  A break with an activity: whether it runs for the whole venue, every zone, not just its own.
  """
  venueWide: Boolean!

  """
  When advancing put it on.
  """
  wentOnAt: ISO8601DateTime
}

"""
What runs by itself in the venue's chat while a segment or intermission is on.
"""
enum AppearanceActivity {
  """
  The event's chat prompts carry on.
  """
  PROMPTS

  """
  Group trivia: the room talks each round over in the chat and votes together (Venue.trivia). No scores.
  """
  TRIVIA
}

"""
The connection type for Appearance.
"""
type AppearanceConnection {
  """
  A list of edges.
  """
  edges: [AppearanceEdge]

  """
  A list of nodes.
  """
  nodes: [Appearance]

  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!
}

"""
An edge in a connection.
"""
type AppearanceEdge {
  """
  A cursor for use in pagination.
  """
  cursor: String!

  """
  The item at the end of the edge.
  """
  node: Appearance
}

"""
How a lineup entry ends.
"""
enum AppearanceEndTiming {
  """
  When the venue advances to what is next.
  """
  ADVANCE

  """
  When the night ends.
  """
  CLOSE

  """
  durationMinutes after it goes on, or when the venue advances, whichever is first.
  """
  DURATION

  """
  At its end time.
  """
  TIME
}

"""
What a lineup entry is.
"""
enum AppearanceKind {
  """
  Someone (or several people) on: hosting, DJing, performing or MCing.
  """
  ACT

  """
  A break in the show.
  """
  INTERMISSION

  """
  A generic time block with a title, e.g. "Photos with cast" for 10 minutes
  after an act (endTiming DURATION). It and an intermission can run an activity.
  """
  SEGMENT
}

"""
What someone is doing at a venue.
"""
enum AppearanceRole {
  """
  DJing.
  """
  DJ

  """
  Hosting.
  """
  HOST

  """
  MCing.
  """
  MC

  """
  Performing, e.g. a drag or live act.
  """
  PERFORMER

  """
  Singing karaoke: a signup, with its song as songRequest.
  """
  SINGER
}

"""
How a lineup entry starts.
"""
enum AppearanceStartTiming {
  """
  At its time, by the clock (or earlier, if advanced to).
  """
  HARD

  """
  No set time: when the venue advances to it.
  """
  NONE

  """
  Around its time: when the venue advances to it.
  """
  SOFT
}

"""
Where a lineup entry is in its night.
"""
enum AppearanceState {
  """
  Finished, or its night is over.
  """
  DONE

  """
  On now.
  """
  ON

  """
  Hasn't gone on yet.
  """
  UPCOMING
}

"""
A count rounded down into a bucket (none, a few, 5+, 10+, 25+, 50+, 100+), never exact.
"""
type ApproximateCount {
  """
  The bucket's floor: 0, 1, 5, 10, 25, 50 or 100.
  """
  atLeast: Int!

  """
  How to show it, e.g. "A few" or "10+".
  """
  label: String!
}

"""
One of Arbiter's guard policies about the AI host, and the score it flags at for the audience.
"""
type ArbiterGuardPolicy {
  """
  The score it flags at unless someone sets another.
  """
  default: Float!

  """
  The policy, e.g. rule_override.
  """
  key: String!

  """
  What it checks, for people.
  """
  name: String!

  """
  Whether someone set its score.
  """
  overridden: Boolean!

  """
  The score (0 to 1) it flags at.
  """
  value: Float!
}

"""
Arbiter (Moderation::Arbiter, key moderation_lmstudio): the moderator and AI
host (Glam) that runs on someone's own Mac with local models, following the
moderation feed over a websocket. How it judges and hosts for the audience is
set in the Moderation plugin's settings.
"""
type ArbiterModerationProvider implements IModerationProvider & IProvider {
  """
  Actions it can take, e.g. escalate or remove_message. An audience grants it some of them.
  """
  actions: [String!]!

  """
  Policy categories it judges, e.g. spam or threats.
  """
  categories: [String!]!

  """
  Chat events it receives, e.g. message.created or user.joined.
  """
  events: [String!]!

  """
  Whether it reads this audience's chat now: always for inline ones; for remote
  ones, while a live service token of the audience's is issued for it with
  chat:moderate:*.
  """
  following: Boolean!

  """
  Whether it receives each event on this server as it happens.
  """
  inline: Boolean!

  """
  Its key, e.g. karafun.
  """
  key: String!

  """
  Its name, e.g. KaraFun.
  """
  name: String!

  """
  Whether it runs on its own server and dials in for the event feed.
  """
  remote: Boolean!

  """
  How Arbiter judges and hosts for the endpoint audience. Admins only; null for everyone else.
  """
  settings: ArbiterModerationSettings @requires(permissions: ["audience:admin:*"])
}

"""
How Arbiter judges and hosts for an audience, set in the console's Moderation
plugin. Unset values show their defaults; the Mac keeps its own value for
anything nobody has set yet.
"""
type ArbiterModerationSettings {
  """
  The conformal sets' error rate (0.01 to 0.3): lower makes more answers unsure.
  """
  alpha: Float!

  """
  Whether anyone has set anything yet.
  """
  configured: Boolean!

  """
  Under this share of the answer on true/false (0.1 to 0.9), a check is unscored and goes to a person.
  """
  coverageThreshold: Float!

  """
  The evaluation queue's work types Arbiter's worker takes.
  """
  evaluationTypes: [String!]!

  """
  What Glam, the AI host, does: shadow (drafts, posts nothing), approve (a person approves each step) or live.
  """
  glamMode: String!

  """
  The guard's policies about the AI host, with the score each flags at.
  """
  guardPolicies: [ArbiterGuardPolicy!]!

  """
  The AI host's picture in the chats, an https URL; blank for Glam's.
  """
  hostAvatar: String!

  """
  What the AI host is called in the chats and its own prompt (default Glam).
  """
  hostName: String!

  """
  The prompts Arbiter's models are shown, as this audience has them.
  """
  prompts: [ArbiterPrompt!]!

  """
  What Glam's “Re-show guidelines” posts.
  """
  roomGuidelines: String!

  """
  The moderation rules (config/moderation/matchers.yml), with the score each is acted on at per venue rating.
  """
  rules: [ArbiterRule!]!

  """
  Whether the moderation rules are checked.
  """
  rulesEnabled: Boolean!

  """
  Which model judges the rules: guard (fast) or decisions.
  """
  rulesModel: String!

  """
  When someone last changed them.
  """
  updatedAt: ISO8601DateTime

  """
  Which rules' thresholds apply: general (all ages) or adult.
  """
  venueRating: String!

  """
  The work types there are to choose from.
  """
  workTypes: [String!]!
}

"""
One of the prompts Arbiter's models are shown, as this audience has it: the
repo's default or the audience's own. {{host_name}} and {{app_name}} are filled
in by the server, the arguments by the Mac.
"""
type ArbiterPrompt {
  """
  The {{variables}} the Mac fills in, besides the server’s.
  """
  arguments: [String!]!

  """
  The template as this audience has it.
  """
  body: String!

  """
  The repo's default (config/arbiter/prompts).
  """
  defaultBody: String!

  """
  Where it is used.
  """
  description: String!

  """
  The first 16 hex digits of the body's SHA-256, as traces record.
  """
  digest: String!

  """
  The template, e.g. glam.system.
  """
  name: String!

  """
  Whether this audience changed it.
  """
  overridden: Boolean!

  """
  When this audience last changed it.
  """
  updatedAt: ISO8601DateTime

  """
  How the Mac uses it: system (the system prompt) or user_suffix (after the chat).
  """
  use: String!

  """
  The default's version, with the audience's change time when overridden.
  """
  version: String!
}

"""
One moderation rule Arbiter checks, and the score it is acted on at for the audience, per venue rating.
"""
type ArbiterRule {
  """
  The score (0 to 1) it is acted on at in an adult room.
  """
  adult: Float!

  """
  The matchers' seed score for an adult room.
  """
  defaultAdult: Float!

  """
  The matchers' seed score for a general room.
  """
  defaultGeneral: Float!

  """
  The score (0 to 1) it is acted on at in a general room.
  """
  general: Float!

  """
  The rule, e.g. identity_hate.
  """
  key: String!

  """
  The rule, for people.
  """
  name: String!

  """
  Whether someone set its scores.
  """
  overridden: Boolean!
}

"""
An audience: its listings, members and configuration. On an audience's endpoints it is the query root.
"""
type Audience implements IRelay & Node {
  """
  App Review settings: period end time and reusable review code.
  """
  appReview: AudienceAppReview!

  """
  The published categories of promoted card, for "Cards you see". What a viewer
  turns off stays on their device and is never sent here.
  """
  cardCategories: [CardCategory!]! @endpoint(in: [AUDIENCE, STAFF])

  """
  The instance's IAudienceChat mixin. Left out of the schema where its module isn't installed.
  """
  chat: IAudienceChat! @endpoint(in: [AUDIENCE, STAFF])

  """
  The locale nearest a position.
  """
  closestLocale(
    """
    Near.
    """
    near: CoordinatesInput!
  ): Locale @endpoint(in: [AUDIENCE, STAFF])

  """
  Plugins marked disabled in the admin console. Configuration and runtime behavior are preserved.
  """
  disabledPluginKeys: [String!]!

  """
  Domains connected to this audience. They change on /v1/tenants/graphql only.
  """
  domains: [AudienceDomain!]!

  """
  The instance's IAudienceEvents mixin. Left out of the schema where its module isn't installed.
  """
  events: IAudienceEvents! @endpoint(in: [AUDIENCE, STAFF])

  """
  Declared mixins and viewer access gates.
  """
  extensionMixins: [ExtensionMixin!]!

  """
  Capabilities available to this audience. Configured remotes are excluded.
  """
  extensions(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): ExtensionConnection!

