"""
A message someone sent in a venue's chat room.
"""
type VenueMessage implements ChatMessage & HasTribes & Node {
  """
  Whether the server posted it on its own, like an "On now" announcement.
  """
  automatic: Boolean!

  """
  The sender's profile photo, or the venue's photo for a post as the venue.
  """
  avatarUrl: PhotoURL

  """
  What they wrote: the text, or a rich message's body or caption (may be empty).
  """
  body: String!

  """
  When a special stops showing.
  """
  endsAt: ISO8601DateTime

  """
  The event an event message shares.
  """
  event: Event

  """
  The ID of the message.
  """
  id: ID!

  """
  What the message is.
  """
  kind: ChatKind!

  """
  The sender's membership in the room's audience, for kicking or banning them. Admins only; null for anyone else.
  """
  member: AudienceMember @requires(permissions: ["audience:read:*"])

  """
  The message as apps that only show text show it: the text, or a rich message in words ("Shared an event: Sunset Social").
  """
  message: String!

  """
  The sender's name: in full for themself, their friends and admins; first name
  and last initial ("Aurora B.") for anyone else, as the room shows it. The
  venue's name for a post as the venue.
  """
  name: String

  """
  The talent listing it was posted as, if any.
  """
  person: Person

  """
  What's in a photo message's picture, for screen readers, when its poster said.
  """
  photoAlt: String

  """
  The photo of a photo message or an announcement.
  """
  photoUrl: PhotoURL

  """
  Whether it's the announcement pinned under the room's title.
  """
  pinned: Boolean!

  """
  Whether it was posted as the room's audience, like a prompt: shown with its name and mark, not a person.
  """
  postedAsAudience: Boolean!

  """
  Whether talent posted it as their listing (role HOST): `person` is who.
  """
  postedAsPerson: Boolean!

  """
  Whether it was posted as the venue.
  """
  postedAsVenue: Boolean!

  """
  Whether they can be reached now: in chat, by push, or neither. OFFLINE unless
  the viewer is them, a friend of theirs, or an admin.
  """
  presence: Presence!

  """
  The prompt a PROMPT message puts to the room.
  """
  prompt: ChatPromptFrame

  """
  The prompt a TEXT message answers, if it does.
  """
  promptId: ID

  """
  Who removed it and why, for a removed message in a transcript asked with includeRemoved; null while it shows.
  """
  removal: ChatMessageRemoval

  """
  The song request or karaoke signup a REQUEST message made, with its place in the queue and what became of it.
  """
  request: SongRequest

  """
  Their role in the room, if any.
  """
  role: ChatRole

  """
  Who it is from, as apps draw it: the room, a bot, the venue, someone posting
  as a listing, or a member. Replaces postedAsVenue, postedAsPerson and
  postedAsAudience.
  """
  sender: Sender!

  """
  When they sent it.
  """
  sentAt: ISO8601DateTime!

  """
  The tribes the signed-in user and they both identify with, for the "You're
  both" mark in venue chat (each tag has its bothPhrase). Only ever the two of
  them see it; empty for the viewer themselves and when signed out.
  """
  sharedTribes: [Tag!]!

  """
  An announcement or special's headline.
  """
  title: String

  """
  Their tribes here that the signed-in user may see: the ones they share, and
  public ones only where the audience allows public tribes. All of them for the
  viewer themselves.
  """
  tribes: [TribeIdentification!]!

  """
  The ID of the user who sent it.
  """
  userId: ID!
}

