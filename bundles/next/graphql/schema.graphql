  whereabouts any more. They aren't told. The audience's admins are, in the
  console's Reports queue.
  """
  blockUser(
    """
    Parameters for BlockedUserAdd
    """
    input: BlockedUserAddInput!
  ): BlockedUserAddPayload @requires(permissions: ["users:write:self"])

  """
