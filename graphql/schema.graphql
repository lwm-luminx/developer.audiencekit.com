  HARD

  """
  No set time: when the venue advances to it.
  """
  NONE

  """
  Around its time: when the venue advances to it.
  """
  SOFT
}

"""
Where a lineup entry is in its night.
"""
enum AppearanceState {
  """
  Finished, or its night is over.
  """
  DONE

  """
  On now.
  """
  ON

  """
  Hasn't gone on yet.
  """
  UPCOMING
}

