}

"""
How a lineup entry ends.
"""
enum AppearanceEndTiming {
  """
  When the venue advances to what is next.
  """
  ADVANCE

  """
  When the night ends.
  """
  CLOSE

  """
  At its end time.
  """
  TIME
}

"""
What a lineup entry is.
"""
enum AppearanceKind {
  """
  Someone (or several people) on: hosting, DJing, performing or MCing.
  """
  ACT

  """
  A break in the show.
  """
  INTERMISSION
}

"""
What someone is doing at a venue.
"""
enum AppearanceRole {
  """
  DJing.
  """
  DJ

  """
  Hosting.
  """
  HOST

  """
  MCing.
  """
  MC

  """
  Performing, e.g. a drag or live act.
  """
  PERFORMER

  """
  Singing karaoke: a signup, with its song as songRequest.
