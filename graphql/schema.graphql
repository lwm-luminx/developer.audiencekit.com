(advanceLineup).
"""
type Appearance implements Node {
  """
  When advancing (or finishing it) took it off.
  """
  cameOffAt: ISO8601DateTime

  """
  How it ends.
  """
  endTiming: AppearanceEndTiming!

  """
  Its set end time; null until close or advanced.
  """
  endsAt: ISO8601DateTime

  """
  The event whose lineup it's on, built ahead; null for one on the venue night's own lineup.
  """
  event: Event

  """
  Its UUID.
  """
  id: ID!

  """
  An act or an intermission.
  """
  kind: AppearanceKind!

  """
  The venue night it is on.
  """
  night: ISO8601Date!

  """
  Who's on it, in billing order: two for a duet.
  """
  people(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): PersonConnection!

  """
  Who, or the first of them; null for an intermission.
  """
  person: Person

  """
  Its place in its lineup's running order, from 0.
  """
  position: Int!

  """
  What they are doing; null for an intermission.
  """
  role: AppearanceRole

  """
  A singer's karaoke signup: the song, artist and who is singing it; null for everything else.
  """
  songRequest: SongRequest

  """
  How it starts.
  """
  startTiming: AppearanceStartTiming!

  """
  Its set (hard or soft) time, or when an entry with no set time went on; null until then.
  """
  startsAt: ISO8601DateTime

  """
  Upcoming, on now or done.
  """
  state: AppearanceState!

  """
  An act's billing (a duet's name) or an intermission's label, if it has one.
  """
  title: String

  """
  Where.
  """
  venue: Venue!

  """
  When advancing put it on.
  """
  wentOnAt: ISO8601DateTime
}

