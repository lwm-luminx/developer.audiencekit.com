"""
The local Cover implementation of a venue's cover charge.
"""
type VenueCoverView implements IVenueCover {
  """
  Whether the viewer can scan passes: the audience's admins and its listing managers.
  """
  canWorkDoor: Boolean!

  """
  Its usual cover in cents, on the nights in days.
  """
  cents: Int

  """
  Tonight's cover, or null when there is none (or an event tonight sells tickets instead).
  """
  charge(
    """
    Another night instead.
    """
    night: ISO8601Date
  ): CoverCharge

  """
  The venue's coat check service tonight, if offered.
  """
  coatCheck: CoatCheck

  """
  The weekdays its cover applies, 0 for Sunday; empty for every night.
  """
  days: [Int!]!

  """
  Its door for a night: covers paid and scanned. Null unless canWorkDoor.
  """
  door(
    """
    Defaults to tonight.
    """
    night: ISO8601Date
  ): DoorNight

  """
  Who pays processing fees.
  """
