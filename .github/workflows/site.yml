name: Site

# Builds developer.audiencekit.com from the API's docs bundles (bundles/main and bundles/next, committed to main by the
# API repository's Developer docs workflow on every build of its main and next branches), the public audience-kit-sdk
# and the private staff-kit (or its snapshot in vendor/staff-kit/), and deploys it to the Cloudflare Worker
# developer-audiencekit-com (wrangler.jsonc), whose custom domain is developer.audiencekit.com. A daily run picks up
# SDK changes, which don't trigger this repository. Pull requests build without deploying.
#
# Deploying needs the repository secrets CLOUDFLARE_API_TOKEN (a token with Workers Scripts: Edit on the account, and
# Workers Routes: Edit plus DNS: Edit on the audiencekit.com zone, for the custom domain) and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Publishes queue behind each other; a new push to a PR cancels that PR's older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: lwm-luminx/audience-kit-sdk
          path: .sdk
      # staff-kit is private: with the STAFF_KIT_TOKEN secret (a fine-grained token with contents read on it) the
      # StaffKit pages are built from its current READMEs; without it, from the snapshot in vendor/staff-kit/.
      - if: env.STAFF_KIT_TOKEN != ''
        env:
          STAFF_KIT_TOKEN: ${{ secrets.STAFF_KIT_TOKEN }}
        uses: actions/checkout@v5
        with:
          repository: lwm-luminx/staff-kit
          path: .staff-kit
          token: ${{ secrets.STAFF_KIT_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set, so the site was built but not deployed."
            exit 1
          fi
          npm run deploy
